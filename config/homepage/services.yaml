- Today:
    - Calendar:
        widget:
          type: calendar
          view: monthly
          firstDayInWeek: sunday
          showTime: true
          timezone: America/New_York
          maxEvents: 10
          integrations:
            - type: ical
              url: "{{HOMEPAGE_FILE_PERSONAL_ICAL}}"
              name: Personal
              color: purple

    - Daily:
        icon: mdi-calendar-check
        description: Tasks and reminders

    - News:
        icon: mdi-rss
        href: https://glance.wormlogic.com/news
        widget:
          type: iframe
          name: News
          src: https://glance.wormlogic.com/embed
          classes: h-72
          allowScrolling: yes

