substitutions:
  device_name: esp-espresso-01
  friendly_name: Espresso ESP 01
  area: Kitchen
  board: esp32-c3-devkitm-1

  api_encryption_key: !secret esp_espresso_01_api_key
  ota_password: !secret esp_espresso_01_ota_password

packages:
  common: !include packages/common.yaml
  wifi: !include packages/wifi.yaml
  diagnostics: !include packages/diagnostics.yaml
  bluetooth: !include packages/bluetooth-proxy.yaml

binary_sensor:
  - platform: gpio
    id: coffee_water_sensor_raw
    name: "Coffee Maker Water Sensor"
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 500ms
      - delayed_off: 500ms
